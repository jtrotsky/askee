<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>askee</title>
<style>
  /* Every colour is a role variable set from the active theme (/api/meta), so the eight
     themes swap in one place and match the terminal deck exactly. */
  :root { --surface:#0b0e14; --panel:#10141b; --border:#2b313c; --grid:#1d222b; --text:#d0d0d0;
          --dim:#8a8f98; --title:#5fd7ff; --accent:#ffaf00; --gap:8px; --tileh:300px; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--surface); color:var(--text);
              font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding:8px 10px;
           border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:2; }
  .brand { color:var(--title); font-weight:700; }
  nav, .ranges { display:flex; flex-wrap:wrap; gap:4px; }
  button { background:none; border:1px solid var(--border); color:var(--dim); font:inherit;
           padding:3px 9px; border-radius:3px; cursor:pointer; }
  button.on { color:var(--accent); border-color:var(--accent); font-weight:700; }
  button:hover { color:var(--text); }
  select { background:var(--panel); color:var(--text); border:1px solid var(--border); font:inherit; padding:3px 6px; border-radius:3px; }
  .stamp { margin-left:auto; color:var(--dim); }
  main { display:grid; gap:var(--gap); padding:var(--gap); grid-template-columns:repeat(var(--cols,2), minmax(0,1fr)); grid-auto-rows:var(--cellh,300px); grid-auto-flow:row dense; }
  .body { overflow-y:auto; }
  .pager { display:flex; gap:4px; align-items:center; color:var(--dim); }
  .tile { background:var(--panel); border:1px solid var(--border); border-radius:4px;
          display:flex; flex-direction:column; min-width:0; position:relative; }
  .tile h2 { margin:0; padding:6px 10px 0; font-size:13px; color:var(--title); font-weight:700;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile h2 small { color:var(--dim); font-weight:400; margin-left:6px; }
  .tile .why { color:var(--dim); font-weight:400; margin-left:6px; cursor:help; }
  .tile .why:hover, .tile .why:focus { color:var(--text); outline:none; }
  .tile .sub { display:none; position:absolute; left:8px; right:8px; top:26px; z-index:3; padding:5px 8px;
               background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:12px; white-space:normal; }
  .tile.open .sub { display:block; }
  .body { flex:1; min-height:0; position:relative; }
  canvas { position:absolute; left:0; top:0; width:100%; height:100%; }
  pre { margin:0; padding:4px 10px; overflow:auto; height:100%; color:var(--text); }
  .foot { padding:2px 10px 6px; color:var(--dim); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .err { color:var(--accent); padding:10px; }
  .tip { position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--border);
         padding:4px 7px; font-size:12px; display:none; z-index:3; white-space:nowrap; }
  .tnote { color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<header>
  <div class="brand" id="brand">askee</div>
  <nav id="groups"></nav>
  <div class="ranges" id="ranges"></div>
  <div class="pager" id="pager"></div>
  <select id="themes" title="theme (t cycles)"></select>
  <div class="stamp" id="stamp"></div>
</header>
<main id="grid"></main>
<script>
"use strict";
let META = null, TH = null, PAL = [], SEQ = [], cur = 0, page = 0, pages = [[]], range = "24h", data = null, timer = null, themeChoice = "auto";
const $ = id => document.getElementById(id);

function fmt(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return (v/1e6).toFixed(2) + "M";
  if (a >= 1e4) return (v/1e3).toFixed(1) + "k";
  if (a >= 1000) return Math.round(v).toLocaleString("en-NZ");   // thousands separator
  if (a >= 100) return v.toFixed(0);
  if (a >= 10) return v.toFixed(1);
  return v.toFixed(2);
}
function tfmt(t, span) {
  const d = new Date(t * 1000);
  if (span > 36*3600) return d.toLocaleDateString(undefined, {day:"2-digit", month:"short"});
  return d.toLocaleTimeString(undefined, {hour:"2-digit", minute:"2-digit", hour12:false});
}
// colour helpers — the same maths as the Go side (themes.go)
const hx = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
const toHex = c => "#" + c.map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, "0")).join("");
const mixc = (a, b, t) => toHex(hx(a).map((x, i) => x + (hx(b)[i] - x) * t));
function ramp(stops, t) {
  t = Math.max(0, Math.min(1, t)); const f = t * (stops.length - 1), i = Math.min(Math.floor(f), stops.length - 2);
  return mixc(stops[i], stops[i+1], f - i);
}
const alpha = (h, a) => { const c = hx(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
// temperature colour from the ACTIVE theme: smooth ramp, six hard steps (flat), or ink (mono)
function thermalAt(v) {
  const st = TH.thermal; if (!st || !st.length) return PAL[0];
  const f = (v - META.thermal_range[0]) / (META.thermal_range[1] - META.thermal_range[0]);
  if (TH.style === "flat") return st[Math.max(0, Math.min(st.length - 1, Math.floor(f * st.length)))];
  return ramp(st, f);
}
const dashOf = i => (TH.mono || TH.dashed) ? META.dashes[i % META.dashes.length] : [];
// "auto" follows the system: newsprint on a light system, carbon on a dark one — the two
// print themes, so the default is the most accessible one in either light.
const sysLight = matchMedia("(prefers-color-scheme: light)");
function resolveTheme(id) { return id === "auto" ? (sysLight.matches ? "newsprint" : "carbon") : id; }
sysLight.addEventListener("change", () => { if (themeChoice === "auto") applyTheme("auto"); });
function applyTheme(id) {
  themeChoice = id;
  const rid = resolveTheme(id);
  TH = META.themes.find(t => t.id === rid) || META.themes[0];
  const names = ["surface","panel","border","grid","text","dim","title","accent"];
  names.forEach((n, i) => document.documentElement.style.setProperty("--" + n, TH.vars[i]));
  PAL = TH.palette; SEQ = TH.seq;
  localStorage.setItem("askee-theme", themeChoice);
  buttons(); render();
}

// ── layout ───────────────────────────────────────────────────────────────────────
// The viewport is a grid of cells: columns by width, rows by how many readable tiles fit the
// height (a tile is never squeezed below MIN_TILE px). Each chart takes [cols, rows] cells —
// from the config's span, or worked out from how many bars or lines it must show at a
// readable size. Charts are packed in order into pages of cols × rows cells: ↑/↓ moves
// between pages, ←/→ between groups. On a phone (one column) the page simply scrolls.
const MIN_TILE = 250, GAP = 8, BAR_ROW = 15, TEXT_ROW = 16;
function geometry() {
  const w = innerWidth, h = innerHeight - document.querySelector("header").offsetHeight - GAP;
  const cols = w >= 1700 ? 3 : w >= 820 ? 2 : 1;
  const phone = cols === 1;
  const rows = phone ? 999 : Math.max(1, Math.floor((h + GAP) / (MIN_TILE + GAP)));
  const cellH = phone ? Math.max(280, Math.round(innerHeight * 0.46)) : Math.floor((h - GAP*(rows - 1)) / rows);
  return {cols, rows, cellH, phone};
}
function spanOf(t, g) {
  let [c, r] = t.span || [0, 0];
  c = Math.min(Math.max(c || 1, 1), g.cols);
  if (!r) {   // automatic height: enough rows for the content at a readable size
    const chrome = 48;   // title and footer
    const need = t.kind === "bars" ? chrome + (t.bars || []).length * BAR_ROW
               : t.kind === "text" ? chrome + (t.lines || []).length * TEXT_ROW : 0;
    r = need ? Math.ceil((need + GAP) / (g.cellH + GAP)) : 1;
  }
  return [c, Math.min(Math.max(r, 1), g.phone ? 4 : g.rows)];
}
// Pack in order. A tall chart that would overflow the page shrinks to the rows that are left
// (its content scrolls inside the tile at full size) rather than leaving a hole and a new page.
function paginate(tiles, g) {
  if (g.phone) return [tiles.map((t, i) => ({i, span: spanOf(t, g)}))];
  const cap = g.cols * g.rows, out = [[]];
  let used = 0;
  tiles.forEach((t, i) => {
    let [c, r] = spanOf(t, g);
    if (used + c * r > cap) {
      const rr = Math.floor((cap - used) / c);
      if (rr >= 1 && r > 1) r = rr;
      else if (out[out.length - 1].length) { out.push([]); used = 0; }
    }
    out[out.length - 1].push({i, span: [c, r]}); used += c * r;
  });
  return out;
}

function setup(cv) {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width*dpr)); cv.height = Math.max(1, Math.round(r.height*dpr));
  const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.font = "11px ui-monospace,Menlo,Consolas,monospace"; c.textBaseline = "middle";
  return [c, r.width, r.height];
}

function stacked(series) {
  const acc = new Map();
  return series.map(s => ({name: s.name, t: s.t, v: s.v.map((v, k) => { const x = (acc.get(s.t[k]) || 0) + v; acc.set(s.t[k], x); return x; })}));
}

// Line charts follow Tufte and Wei: no legend box and no grid. Each line is named at its right
// end with its latest value; the y axis is a range frame — a hairline spanning only the data,
// labelled at the data's own min and max; reference values are dashed and named in the same
// margin; events (reboots, backup runs) are hairlines with a word, so "what happened here?"
// is answered on the chart.
function spread(items, top, bot, h) {   // nudge end labels apart; keep them inside [top, bot]
  items.sort((a, b) => a.y - b.y);
  if (items.length) items[0].y = Math.max(top, items[0].y);
  for (let i = 1; i < items.length; i++) if (items[i].y - items[i-1].y < h) items[i].y = items[i-1].y + h;
  for (let i = items.length - 1; i >= 0; i--) {
    const lim = i === items.length - 1 ? bot : items[i+1].y - h;
    if (items[i].y > lim) items[i].y = lim;
  }
  for (const it of items) it.y = Math.max(top, it.y);
  return items;
}
const lastOf = s => s.v[s.v.length - 1];
function endText(t, s, n) { return (n === 1 ? "" : s.name + " ") + fmt(lastOf(s)) + (t.unit || ""); }
function sample(c, x, y, col, dash, band) {  // the line's own style, so a label needs no colour
  c.save();
  if (band) { c.fillStyle = band; c.fillRect(x, y - 4, 10, 8); c.strokeStyle = col; c.lineWidth = 1; c.strokeRect(x + .5, y - 3.5, 9, 7); }
  else { c.strokeStyle = col; c.lineWidth = 2; c.setLineDash(dash); c.beginPath(); c.moveTo(x, y); c.lineTo(x + 12, y); c.stroke(); }
  c.restore();
}
function bandFill(c, col, i, T, ph) {
  if (TH.mono) return alpha(col, .10 + .12 * (i % 4));          // solid grey tints, never hatching
  if (TH.style === "smooth") { const g = c.createLinearGradient(0, T, 0, T + ph); g.addColorStop(0, alpha(col, .75)); g.addColorStop(1, alpha(col, .45)); return g; }
  return alpha(col, .62);
}

// one panel: range frame, refs, events, the data, and its end labels
function panel(c, t, raw, b, opts) {
  const S = t.stack ? stacked(raw) : raw, u = t.unit || "";
  let dlo = Infinity, dhi = -Infinity;
  for (const s of S) for (const v of s.v) { if (v < dlo) dlo = v; if (v > dhi) dhi = v; }
  if (!isFinite(dlo)) return null;
  let lo = dlo, hi = dhi;
  if (!opts.split) for (const r of t.refs || []) { lo = Math.min(lo, r.value); hi = Math.max(hi, r.value); }
  if (t.ymin != null) lo = Math.min(lo, t.ymin); else { const p = (hi - lo)*0.08 || Math.max(1, Math.abs(hi)*0.1); lo -= p; }
  if (t.ymax != null) { hi = Math.max(hi, t.ymax); if (t.ymax === 100) hi = Math.min(hi, 100); } else hi += (hi - lo)*0.06;
  if (hi <= lo) hi = lo + 1;
  const {L, T, pw, ph} = b;
  const X = ts => L + (ts - t.start) / (t.end - t.start) * pw, Y = v => T + (1 - (v - lo)/(hi - lo)) * ph;
  // range frame: the axis is drawn only where the data is, and says where that is
  const ax = L - 5;
  c.strokeStyle = TH.vars[5]; c.lineWidth = 1; c.setLineDash([]);
  c.beginPath(); c.moveTo(ax + .5, Math.round(Y(dhi))); c.lineTo(ax + .5, Math.round(Y(dlo)) + 1); c.stroke();
  c.textAlign = "right"; c.fillStyle = TH.vars[4];
  const yHi = Y(dhi), yLo = Y(dlo);
  c.fillText(fmt(dhi), ax - 4, yHi);
  if (yLo - yHi > 12) c.fillText(fmt(dlo), ax - 4, yLo);
  // a fixed scale (0–100 %, zero baseline) is stated once, quietly, where it does not collide
  c.fillStyle = TH.vars[5];
  if (t.ymin != null && Y(lo) - yLo > 12) c.fillText(fmt(lo), ax - 4, Y(lo));
  if (t.ymax != null && yHi - Y(hi) > 12) c.fillText(fmt(hi), ax - 4, Y(hi));
  const labels = [];
  // reference lines: "compared to what" — dashed, recessive, named at the right end
  if (!opts.split) {
    c.save(); c.setLineDash([4, 4]); c.lineWidth = 1; c.strokeStyle = TH.vars[5];
    for (const r of t.refs || []) {
      const y = Math.round(Y(r.value)) + .5;
      c.beginPath(); c.moveTo(L, y); c.lineTo(L + pw, y); c.stroke();
      labels.push({y, text: `${r.label} ${fmt(r.value)}${u}`, ref: true});
    }
    c.restore();
  }
  // events: a hairline and a word, at the top of the panel
  if (opts.events) {
    let lastX = -Infinity;
    c.save(); c.strokeStyle = TH.vars[5]; c.lineWidth = 1; c.setLineDash([1, 3]); c.fillStyle = TH.vars[5]; c.textAlign = "left";
    for (const e of t.events || []) {
      if (e.t < t.start || e.t > t.end) continue;
      const x = Math.round(X(e.t)) + .5;
      c.beginPath(); c.moveTo(x, T); c.lineTo(x, T + ph); c.stroke();
      if (x - lastX > 60) { c.fillText(e.label, x + 3, T - 10); lastX = x; }
    }
    c.restore();
  }
  const gap = 3 * (t.step || 60);
  const path = (s, close, under) => {
    c.beginPath(); let pen = false, last = 0, first = null, prevX = 0;
    for (let k = 0; k < s.t.length; k++) {
      const x = X(s.t[k]), y = Y(s.v[k]);
      if (pen && s.t[k] - last <= gap) c.lineTo(x, y); else { if (close && first !== null) { c.lineTo(prevX, T + ph); c.lineTo(first, T + ph); } c.moveTo(x, y); first = x; }
      pen = true; last = s.t[k]; prevX = x;
    }
    if (close && first !== null) { c.lineTo(prevX, T + ph); c.lineTo(first, T + ph); c.closePath(); }
  };
  const colOf = i => PAL[(opts.colour ?? i) % PAL.length];
  if (t.stack) {
    // parts of a whole: bands, top first so lower bands sit on top; each named at its middle
    for (let i = S.length - 1; i >= 0; i--) {
      const s = S[i], col = colOf(i);
      c.fillStyle = bandFill(c, col, i, T, ph); path(s, true); c.fill();
      c.strokeStyle = TH.mono ? col : TH.vars[1]; c.lineWidth = 1; path(s, false); c.stroke();
    }
    S.forEach((s, i) => {
      if (!s.v.length) return;
      const below = i ? lastOf(S[i-1]) : lo;
      labels.push({y: (Y(lastOf(s)) + Y(below)) / 2, text: endText(t, raw[i], S.length), col: colOf(i), band: bandFill(c, colOf(i), i, T, ph)});
    });
  } else {
    S.forEach((s, i) => {
      if (!s.v.length) return;
      const col = colOf(i), dash = opts.split ? [] : dashOf(i);
      if (TH.style === "smooth" && S.length <= 2) {   // soft gradient wash: smooth themes only
        const g = c.createLinearGradient(0, T, 0, T + ph);
        if (t.thermal && !TH.mono) { [0, .5, 1].forEach(f => g.addColorStop(f, alpha(thermalAt(hi - (hi - lo)*f), .22 - .18*f))); }
        else { g.addColorStop(0, alpha(col, .30)); g.addColorStop(1, alpha(col, 0)); }
        c.fillStyle = g; path(s, true); c.fill();
      }
      c.lineWidth = 2; c.lineJoin = "round"; c.setLineDash(dash);
      if (t.thermal && !TH.mono) {      // the line itself carries temperature: each segment coloured by value
        for (let k = 1; k < s.t.length; k++) {
          if (s.t[k] - s.t[k-1] > gap) continue;
          c.strokeStyle = thermalAt((s.v[k] + s.v[k-1]) / 2);
          c.beginPath(); c.moveTo(X(s.t[k-1]), Y(s.v[k-1])); c.lineTo(X(s.t[k]), Y(s.v[k])); c.stroke();
        }
      } else { c.strokeStyle = col; path(s, false); c.stroke(); }
      c.setLineDash([]);
      const lc = t.thermal && !TH.mono ? thermalAt(lastOf(s)) : col;
      labels.push({y: Y(lastOf(s)), text: opts.name ? `${s.name} ${fmt(lastOf(s))}${u}` : endText(t, s, S.length), col: lc, dash});
    });
  }
  // the right margin: every line and reference named where it ends, never overlapping
  const lx = L + pw + 6;
  for (const it of spread(labels, T + 5, T + ph - 2, 13)) {
    if (it.ref) { c.fillStyle = TH.vars[5]; c.textAlign = "left"; c.fillText(it.text, lx, it.y); continue; }
    sample(c, lx, it.y, it.col, it.dash || [], it.band);
    c.fillStyle = TH.vars[4]; c.textAlign = "left"; c.fillText(it.text, lx + 16, it.y);
  }
  return {X, Y};
}

function marginFor(c, t, W) {
  const u = t.unit || "", S = t.series || [];
  const texts = S.filter(s => s.v.length).map(s => (S.length === 1 && !t.split ? "" : s.name + " ") + fmt(lastOf(s)) + u)
    .map(x => 16 + c.measureText(x).width);
  if (!t.split) for (const r of t.refs || []) texts.push(c.measureText(`${r.label} ${fmt(r.value)}${u}`).width);
  return Math.min(W * 0.40, Math.max(24, ...texts) + 10);
}

function drawLine(cv, t) {
  const [c, W, H] = setup(cv);
  const S = t.series || [];
  const ev = (t.events || []).some(e => e.t >= t.start && e.t <= t.end);
  const L = 46, T = ev ? 22 : 8, B = 20, R = marginFor(c, t, W), pw = W - L - R, ph = H - T - B;
  if (!S.some(s => s.v.length)) { c.fillStyle = TH.vars[5]; c.fillText("no data in this range", L + 8, T + ph/2); return null; }
  const xLabels = () => {
    c.fillStyle = TH.vars[5];
    const xt = pw > 520 ? 4 : pw > 280 ? 3 : 2;
    for (let i = 0; i <= xt; i++) {
      const ts = t.start + (t.end - t.start)*i/xt;
      c.textAlign = i === 0 ? "left" : i === xt ? "right" : "center";
      c.fillText(tfmt(ts, t.end - t.start), L + pw*i/xt, T + ph + 11);
    }
  };
  if (t.split && S.length > 1) {
    // small multiples: one panel per series, each on its own scale (said in the frame labels)
    const n = S.length, g = 16, h = (ph - g*(n - 1)) / n;
    S.forEach((s, i) => panel(c, t, [s], {L, T: T + i*(h + g), pw, ph: h}, {split: true, name: true, colour: i, events: i === 0}));
    xLabels();
    return {L, pw, T, ph, S};
  }
  const g = panel(c, t, S, {L, T, pw, ph}, {events: true});
  xLabels();
  return {...g, L, pw, T, ph, S};
}

function drawBars(cv, t) {
  const need = 6 + (t.bars || []).length * BAR_ROW;
  if (need > cv.parentElement.clientHeight) cv.style.height = need + "px";
  const [c, W, H] = setup(cv);
  let bars = t.bars || [];
  if (!bars.length) { c.fillStyle = TH.vars[5]; c.fillText("no data", 10, 14); return null; }
  // rows never shrink below a readable height; if they still do not fit, the tile scrolls
  const rowH = Math.max(BAR_ROW, Math.min(26, (H - 6) / bars.length));
  const lw = Math.min(W*0.42, Math.max(...bars.map(b => c.measureText(b.label).width)) + 12);
  const max = Math.max(...bars.map(b => b.value), t.unit === "%" ? 100 : 0) || 1, vw = 76, bw = W - lw - vw - 14;  // % is drawn against 100
  const geo = [];
  bars.forEach((b, i) => {
    const y = 3 + i*rowH + rowH/2, f = b.value / max, len = Math.max(2, f*bw), bh = rowH*0.62;
    c.fillStyle = TH.vars[4]; c.textAlign = "right"; c.fillText(b.label, lw, y);
    // magnitude gradient: the bar's own end colour is its value on the theme's one-hue ramp
    if (TH.style === "smooth") {
      const g = c.createLinearGradient(lw + 6, 0, lw + 6 + bw, 0);
      g.addColorStop(0, SEQ[0]); g.addColorStop(1, SEQ[SEQ.length - 1]); c.fillStyle = g;
    } else c.fillStyle = TH.mono ? alpha(PAL[0], .85) : PAL[0];
    c.beginPath();
    if (c.roundRect) c.roundRect(lw + 6, y - bh/2, len, bh, [0, 4, 4, 0]); else c.rect(lw + 6, y - bh/2, len, bh);
    c.fill();
    c.fillStyle = TH.vars[4]; c.textAlign = "left"; c.fillText(fmt(b.value) + " " + (t.unit || ""), lw + 12 + len, y);
    geo.push({y0: y - rowH/2, y1: y + rowH/2, b});
  });
  return geo;
}

// live: on 15m and 1h the plot window slides with the clock every second (btm-style); the data
// itself refreshes every 15 s. Only the canvases are redrawn, so hover and layout stay put.
let live = [];
const isLive = () => range === "15m" || range === "1h";
setInterval(() => {
  if (!isLive() || !live.length) return;
  const now = Date.now() / 1000;
  for (const L of live) {
    if (L.t.fixed) continue;
    const span = L.t.end - L.t.start; L.t.end = now; L.t.start = now - span;
    const g = drawLine(L.cv, L.t); if (g) Object.assign(L.g, g);
  }
}, 1000);

function render() {
  if (!data || !TH) return;
  live = [];
  const grid = $("grid"), g = geometry();
  pages = paginate(data.tiles, g);
  page = Math.min(page, pages.length - 1);
  document.documentElement.style.setProperty("--cols", g.cols);
  document.documentElement.style.setProperty("--cellh", g.cellH + "px");
  grid.innerHTML = "";
  pager();
  for (const {i: idx, span: [sc, sr]} of pages[page]) {
    const t = data.tiles[idx];
    const el = document.createElement("section"); el.className = "tile";
    el.style.gridColumn = `span ${sc}`; el.style.gridRow = `span ${sr}`;
    el.style.height = (sr * g.cellH + (sr - 1) * GAP) + "px";
    el.innerHTML = `<h2></h2><div class="sub"></div><div class="body"></div><div class="foot"></div><div class="tip"></div>`;
    // the title says what, in a few words; the "so what" waits behind the (i) until asked for
    const h2 = el.querySelector("h2"); h2.textContent = t.title;
    const sm = document.createElement("small"); sm.textContent = [t.unit, t.fixed || data.range].filter(Boolean).join(" · "); h2.append(sm);
    if (t.subtitle) {
      const w = document.createElement("span"); w.className = "why"; w.textContent = "ⓘ"; w.tabIndex = 0;
      w.setAttribute("aria-label", t.subtitle); h2.append(w);
      el.querySelector(".sub").textContent = t.subtitle;
      let pinned = false;
      w.onmouseenter = w.onfocus = () => el.classList.add("open");
      w.onmouseleave = w.onblur = () => { if (!pinned) el.classList.remove("open"); };
      w.onclick = () => { pinned = !pinned; el.classList.toggle("open", pinned); };
    }
    grid.appendChild(el);
    const body = el.querySelector(".body"), foot = el.querySelector(".foot");
    if (t.err) { body.innerHTML = `<div class="err"></div>`; body.firstChild.textContent = "error: " + t.err; continue; }
    if (t.kind === "line") {
      const cv = document.createElement("canvas"); body.append(cv);
      const geo = drawLine(cv, t);
      foot.textContent = t.note || "";
      if (geo) { hoverLine(el, cv, t, geo); live.push({cv, t, g: geo}); }
    } else if (t.kind === "bars") {
      const cv = document.createElement("canvas"); body.append(cv);
      const geo = drawBars(cv, t);
      foot.textContent = t.note || "";
      if (geo) hoverBars(el, cv, t, geo);
    } else {
      const pre = document.createElement("pre"); pre.textContent = (t.lines || []).join("\n"); body.append(pre);
      const longest = Math.max(1, ...(t.lines || []).map(l => [...l].length));
      pre.style.fontSize = Math.max(11, Math.min(13, (body.clientWidth - 20) / (longest * 0.62))) + "px";   // never below 11px: wide tables scroll sideways instead
      foot.textContent = t.note || "";
    }
  }
  $("stamp").textContent = "updated " + new Date(data.generated*1000).toLocaleTimeString(undefined, {hour12:false});
}

function tipAt(el, tip, e, cv, html) {
  const r = cv.getBoundingClientRect();
  tip.innerHTML = html; tip.style.display = "block";
  tip.style.left = Math.min(e.clientX - el.getBoundingClientRect().left + 14, el.clientWidth - tip.offsetWidth - 4) + "px";
  tip.style.top = (e.clientY - el.getBoundingClientRect().top + 12) + "px";
}
function hoverLine(el, cv, t, g) {
  const tip = el.querySelector(".tip");
  cv.addEventListener("mousemove", e => {
    const x = e.clientX - cv.getBoundingClientRect().left;
    if (x < g.L || x > g.L + g.pw) { tip.style.display = "none"; return; }
    const ts = t.start + (x - g.L) / g.pw * (t.end - t.start);
    const rows = (t.series || []).map((s, i) => {
      let k = 0, best = Infinity;
      for (let j = 0; j < s.t.length; j++) { const d = Math.abs(s.t[j] - ts); if (d < best) { best = d; k = j; } }
      const col = t.thermal ? thermalAt(s.v[k]) : PAL[i % PAL.length];
      return s.v.length ? `<span style="color:${col}">■</span> ${s.name} ${fmt(s.v[k])}${t.unit || ""}` : "";
    }).filter(Boolean);
    tipAt(el, tip, e, cv, `<div class="tnote">${new Date(ts*1000).toLocaleString(undefined, {hour12:false})}</div>` + rows.join("<br>"));
  });
  cv.addEventListener("mouseleave", () => tip.style.display = "none");
}
function hoverBars(el, cv, t, geo) {
  const tip = el.querySelector(".tip");
  cv.addEventListener("mousemove", e => {
    const y = e.clientY - cv.getBoundingClientRect().top, hit = geo.find(g => y >= g.y0 && y < g.y1);
    if (!hit) { tip.style.display = "none"; return; }
    tipAt(el, tip, e, cv, `${hit.b.label}<br><b>${fmt(hit.b.value)} ${t.unit || ""}</b>`);
  });
  cv.addEventListener("mouseleave", () => tip.style.display = "none");
}

// ── navigation ──────────────────────────────────────────────────────────────────
function buttons() {
  const nav = $("groups"); nav.innerHTML = "";
  META.groups.forEach((g, i) => { const b = document.createElement("button"); b.textContent = g.title;
    if (i === cur) b.className = "on"; b.onclick = () => go(i); nav.append(b); });
  const rs = $("ranges"); rs.innerHTML = "";
  META.ranges.forEach(r => { const b = document.createElement("button"); b.textContent = r;
    if (r === range) b.className = "on"; b.onclick = () => { range = r; load(); }; rs.append(b); });
  const ts = $("themes"); ts.innerHTML = "";
  const ao = document.createElement("option"); ao.value = "auto";
  ao.textContent = `theme: Auto (${sysLight.matches ? "Newsprint" : "Carbon"}, follows system)`;
  if (themeChoice === "auto") ao.selected = true; ts.append(ao);
  META.themes.forEach(t => {
    const o = document.createElement("option"); o.value = t.id;
    const tag = {validated: " ✓", floor: " ✓ (with line labels)", mono: " — print, line styles", fails: " (not colour-blind safe)"}[t.status] || "";
    o.textContent = `theme: ${t.name}${tag}`;
    o.title = t.note; if (themeChoice !== "auto" && TH && t.id === TH.id) o.selected = true; ts.append(o);
  });
  ts.onchange = () => applyTheme(ts.value);
}
function pager() {
  const p = $("pager"); p.innerHTML = "";
  if (pages.length < 2) return;
  const up = document.createElement("button"); up.textContent = "▲"; up.title = "previous page (↑)"; up.onclick = () => turn(-1);
  const dn = document.createElement("button"); dn.textContent = "▼"; dn.title = "next page (↓)"; dn.onclick = () => turn(1);
  p.append(up, `page ${page + 1}/${pages.length}`, dn);
}
function turn(d) { const n = Math.max(0, Math.min(pages.length - 1, page + d)); if (n !== page) { page = n; render(); } }
function go(i) { cur = (i + META.groups.length) % META.groups.length; page = 0; load(); }
async function load() {
  location.hash = META.groups[cur].id + "/" + range; buttons();
  try {
    const r = await fetch(`api/group/${META.groups[cur].id}?range=${range}`);
    if (!r.ok) throw new Error(r.status + " " + r.statusText);
    data = await r.json(); render();
  } catch (e) { $("stamp").textContent = "fetch failed: " + e.message; }
  clearTimeout(timer); timer = setTimeout(load, isLive() ? 15000 : 30000);
}
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(cur + 1);
  if (e.key === "ArrowLeft") go(cur - 1);
  if (e.key === "ArrowDown" && !geometry().phone) { e.preventDefault(); turn(1); }
  if (e.key === "ArrowUp" && !geometry().phone) { e.preventDefault(); turn(-1); }
  if (e.key === "t") { const i = META.themes.findIndex(t => t.id === TH.id); applyTheme(META.themes[(i + 1) % META.themes.length].id); }
  if (e.key === "a") applyTheme("auto");
  const k = "1234567".indexOf(e.key); if (k >= 0 && META.ranges[k]) { range = META.ranges[k]; load(); }
});
let tx = null, ty = null;
addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > 2*Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1));
  tx = null;
}, {passive:true});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 150); });

(async () => {
  META = await (await fetch("api/meta")).json();
  $("brand").textContent = META.title; document.title = META.title;
  range = META.default_range;
  const [h, rg] = location.hash.slice(1).split("/");
  const i = META.groups.findIndex(g => g.id === h); if (i >= 0) cur = i;
  if (META.ranges.includes(rg)) range = rg;
  const q = new URLSearchParams(location.search).get("theme");
  applyTheme(q || localStorage.getItem("askee-theme") || META.default_theme);
  load();
})();
</script>
</body>
