<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>askee</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  /* Every colour is a role variable set from the active theme (/api/meta), so the eight
     themes swap in one place and match the terminal deck exactly. */
  :root { --surface:#0b0e14; --panel:#10141b; --border:#2b313c; --grid:#1d222b; --text:#d0d0d0;
          --dim:#8a8f98; --title:#5fd7ff; --accent:#ffaf00; --gap:8px; --tileh:300px; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--surface); color:var(--text);
              font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  /* Top row: the server and its groups on the left, the time range on the right. The row under
     it sits on the panels: the pager centred, when the last update was on the right. Both
     stick to the top together. */
  #top { position:sticky; top:0; z-index:2; background:var(--surface); border-bottom:1px solid var(--border); }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding:8px 10px 4px; }
  /* the page control sits in the header, beside the time range it belongs with, not on top of
     the charts; the row under the header carries only when the data was last updated */
  .bar { display:flex; justify-content:flex-end; padding:0 10px 6px; min-height:4px; }
  header .pager { margin-left:auto; margin-right:6px; display:flex; align-items:center; gap:4px; color:var(--dim); }
  header .pager button { padding:3px 6px; }
  .brand { color:var(--title); font-weight:700; }
  nav, .ranges { display:flex; flex-wrap:wrap; gap:4px; }
  button { background:none; border:1px solid var(--border); color:var(--dim); font:inherit;
           padding:3px 9px; border-radius:3px; cursor:pointer; }
  button.on { color:var(--accent); border-color:var(--accent); font-weight:700; }
  button:hover { color:var(--text); }
  /* a range this tab cannot show: there, but out of reach */
  button:disabled, button:disabled:hover { opacity:.35; cursor:default; color:var(--dim); }
  /* a tab whose every chart can go live carries a small dot */
  nav button.live::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%;
                            background:currentColor; margin-right:6px; vertical-align:1px; }
  .stamp { color:var(--dim); }
  /* the help button is deliberately quiet: a bare "?" until hovered */
  #help { border-color:transparent; padding:1px 7px; border-radius:50%; }
  #help:hover, #help.on { border-color:var(--border); color:var(--text); font-weight:400; }
  #helpbox { position:fixed; right:10px; z-index:5; background:var(--panel); border:1px solid var(--border);
             border-radius:4px; padding:10px 12px; font-size:12px; max-width:min(380px, calc(100vw - 20px)); }
  #helpbox table { border-collapse:collapse; }
  #helpbox td { padding:1px 0; vertical-align:top; }
  #helpbox td:first-child { color:var(--accent); padding-right:14px; white-space:nowrap; }
  #helpbox .tl { color:var(--dim); margin:8px 0 4px; }
  #helpbox .tset { display:flex; flex-wrap:wrap; gap:4px; }
  #helpbox .tset button { padding:1px 7px; font-size:12px; }
  main { display:grid; gap:var(--gap); padding:var(--gap); grid-template-columns:repeat(var(--cols,2), minmax(0,1fr)); grid-auto-rows:var(--cellh,300px); grid-auto-flow:row dense; }
  .body { overflow-y:auto; }
  .pager { display:flex; gap:4px; align-items:center; color:var(--dim); }
  .tile { background:var(--panel); border:1px solid var(--border); border-radius:4px;
          display:flex; flex-direction:column; min-width:0; position:relative; }
  .tile h2 { margin:0; padding:6px 10px 0; font-size:13px; color:var(--title); font-weight:700;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile h2 small { color:var(--dim); font-weight:400; margin-left:6px; }
  .tile h2 small.off { color:var(--accent); }
  .tile .why { color:var(--dim); font-weight:400; margin-left:6px; cursor:help; }
  .tile .why:hover, .tile .why:focus { color:var(--text); outline:none; }
  .tile .sub { display:none; position:absolute; left:8px; right:8px; top:26px; z-index:3; padding:5px 8px;
               background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:12px; white-space:normal; }
  .tile.open .sub { display:block; }
  .body { flex:1; min-height:0; position:relative; }
  canvas { position:absolute; left:0; top:0; width:100%; height:100%; }
  pre { margin:0; padding:4px 10px; overflow:auto; height:100%; color:var(--text); }
  .foot { padding:2px 10px 6px; color:var(--dim); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .err { color:var(--accent); padding:10px; }
  .tip { position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--border);
         padding:4px 7px; font-size:12px; display:none; z-index:3; white-space:nowrap; }
  .tnote { color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<div id="top">
  <header>
    <div class="brand" id="brand">askee</div>
    <nav id="groups"></nav>
    <div class="pager" id="pager"></div>
    <div class="ranges" id="ranges"></div>
    <button id="help" title="keys and themes (?)" aria-label="keys and themes" aria-expanded="false">?</button>
  </header>
  <div class="bar">
    <div class="stamp" id="stamp"></div>
  </div>
</div>
<div id="helpbox" hidden>
  <table>
    <tr><td>← →</td><td>previous / next group (swipe on a phone)</td></tr>
    <tr><td>↑ ↓</td><td>previous / next page</td></tr>
    <tr><td>1 – 7</td><td>time range: live, 1h … 90d (greyed out where a tab's data cannot show it)</td></tr>
    <tr><td>t</td><td>next theme</td></tr>
    <tr><td>a</td><td>automatic theme (follows the system)</td></tr>
    <tr><td>?</td><td>this help · Esc closes</td></tr>
  </table>
  <div class="tl">theme</div>
  <div class="tset" id="themeset"></div>
</div>
<main id="grid"></main>
<script>
"use strict";
let META = null, TH = null, PAL = [], SEQ = [], cur = 0, page = 0, pages = [[]], range = "24h", data = null, timer = null, themeChoice = "auto";
// pick is the range the reader chose; range is what the current tab shows: pick, raised to the
// tab's floor (the shortest range every chart in it can show). Moving to a tab with a higher
// floor shows that floor; moving back returns to the pick.
let pick = "24h";
const rix = r => META.ranges.indexOf(r);
function rangeFor(g) { const m = META.groups[g].min; return m && rix(pick) < rix(m) ? m : pick; }
const $ = id => document.getElementById(id);
// Every date, time and number is formatted in NZ style (10/11/2026, 09 Nov, 1,234), never the
// browser's locale: a laptop set to en-US flipped the hover dates to month-first.
const LOC = "en-NZ";

function fmt(v) {
  const a = Math.abs(v);
  // past 10,000, currency style: K, M, B with three significant figures (10.5K, 1.07M, 2.40B)
  const s3 = x => Math.abs(x) >= 100 ? x.toFixed(0) : Math.abs(x) >= 10 ? x.toFixed(1) : x.toFixed(2);
  if (a >= 1e9) return s3(v/1e9) + "B";
  if (a >= 1e6) return s3(v/1e6) + "M";
  if (a >= 1e4) return s3(v/1e3) + "K";
  if (a >= 1000) return Math.round(v).toLocaleString(LOC);   // thousands separator
  if (a >= 100) return v.toFixed(0);
  if (a >= 10) return v.toFixed(1);
  return v.toFixed(2);
}
function tfmt(t, span) {
  const d = new Date(t * 1000);
  if (span > 36*3600) return d.toLocaleDateString(LOC, {day:"2-digit", month:"short"});
  return d.toLocaleTimeString(LOC, {hour:"2-digit", minute:"2-digit", hour12:false});
}
// colour helpers — the same maths as the Go side (themes.go)
const hx = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
const toHex = c => "#" + c.map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, "0")).join("");
const mixc = (a, b, t) => toHex(hx(a).map((x, i) => x + (hx(b)[i] - x) * t));
function ramp(stops, t) {
  t = Math.max(0, Math.min(1, t)); const f = t * (stops.length - 1), i = Math.min(Math.floor(f), stops.length - 2);
  return mixc(stops[i], stops[i+1], f - i);
}
const alpha = (h, a) => { const c = hx(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
// temperature colour from the ACTIVE theme: smooth ramp, six hard steps (flat), or ink (mono)
function thermalAt(v) {
  const st = TH.thermal; if (!st || !st.length) return PAL[0];
  const f = (v - META.thermal_range[0]) / (META.thermal_range[1] - META.thermal_range[0]);
  if (TH.style === "flat") return st[Math.max(0, Math.min(st.length - 1, Math.floor(f * st.length)))];
  return ramp(st, f);
}
const dashOf = i => (TH.mono || TH.dashed) ? META.dashes[i % META.dashes.length] : [];
// "auto" follows the system: newsprint on a light system, carbon on a dark one — the two
// print themes, so the default is the most accessible one in either light.
const sysLight = matchMedia("(prefers-color-scheme: light)");
function resolveTheme(id) { return id === "auto" ? (sysLight.matches ? "newsprint" : "carbon") : id; }
sysLight.addEventListener("change", () => { if (themeChoice === "auto") applyTheme("auto"); });
function applyTheme(id) {
  themeChoice = id;
  const rid = resolveTheme(id);
  TH = META.themes.find(t => t.id === rid) || META.themes[0];
  const names = ["surface","panel","border","grid","text","dim","title","accent"];
  names.forEach((n, i) => document.documentElement.style.setProperty("--" + n, TH.vars[i]));
  PAL = TH.palette; SEQ = TH.seq;
  localStorage.setItem("askee-theme", themeChoice);
  buttons(); render();
}

// ── layout ───────────────────────────────────────────────────────────────────────
// The viewport is a grid of cells: columns by width, rows by how many readable tiles fit the
// height (a tile is never squeezed below MIN_TILE px). Each chart takes [cols, rows] cells —
// from the config's span, or worked out from how many bars or lines it must show at a
// readable size. Charts are packed in order into pages of cols × rows cells: ↑/↓ moves
// between pages, ←/→ between groups. On a phone (one column) the page simply scrolls, and
// nothing about the layout depends on the window's height: a phone's address bar shows and
// hides as the reader scrolls, and a layout tied to it would rebuild under their thumb.
const MIN_TILE = 250, GAP = 8, BAR_ROW = 15, TEXT_ROW = 16;
function geometry() {
  const w = innerWidth, h = innerHeight - $("top").offsetHeight - GAP;
  const cols = w >= 1700 ? 3 : w >= 820 ? 2 : 1;
  const phone = cols === 1;
  const rows = phone ? 999 : Math.max(1, Math.floor((h + GAP) / (MIN_TILE + GAP)));
  const cellH = phone ? Math.min(440, Math.max(280, Math.round(w / 1.3))) : Math.floor((h - GAP*(rows - 1)) / rows);
  return {cols, rows, cellH, phone};
}
function spanOf(t, g) {
  let [c, r] = t.span || [0, 0];
  c = Math.min(Math.max(c || 1, 1), g.cols);
  if (!r) {   // automatic height: enough rows for the content at a readable size
    const chrome = 48;   // title and footer
    const need = t.kind === "bars" ? chrome + (t.bars || []).length * BAR_ROW
               : t.kind === "blocks" ? chrome + 18 + (t.blocks || []).length * ((t.blocks || []).some(b => !b.total) ? 40 : 28)
               : t.kind === "text" ? chrome + (t.lines || []).length * TEXT_ROW
               : t.kind === "clock" ? chrome + 40 + (t.rows || []).length * 14 : 0;
    r = need ? Math.ceil((need + GAP) / (g.cellH + GAP)) : 1;
  }
  return [c, Math.min(Math.max(r, 1), g.phone ? 4 : g.rows)];
}
// Pack in order. A tall chart that would overflow the page shrinks to the rows that are left
// (its content scrolls inside the tile at full size) rather than leaving a hole and a new page.
function paginate(tiles, g) {
  if (g.phone) return [tiles.map((t, i) => ({i, span: spanOf(t, g)}))];
  const cap = g.cols * g.rows, out = [[]];
  let used = 0;
  tiles.forEach((t, i) => {
    let [c, r] = spanOf(t, g);
    if (used + c * r > cap) {
      const rr = Math.floor((cap - used) / c);
      if (rr >= 1 && r > 1) r = rr;
      else if (out[out.length - 1].length) { out.push([]); used = 0; }
    }
    out[out.length - 1].push({i, span: [c, r]}); used += c * r;
  });
  return out;
}

function setup(cv) {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width*dpr)); cv.height = Math.max(1, Math.round(r.height*dpr));
  const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.font = "11px ui-monospace,Menlo,Consolas,monospace"; c.textBaseline = "middle";
  return [c, r.width, r.height];
}

function stacked(series) {
  const acc = new Map();
  return series.map(s => ({name: s.name, t: s.t, v: s.v.map((v, k) => { const x = (acc.get(s.t[k]) || 0) + v; acc.set(s.t[k], x); return x; })}));
}

// Line charts follow Tufte and Wei: no legend box and no grid. Each line is named at its right
// end with its latest value; the y axis is a range frame — a hairline spanning only the data,
// labelled at the data's own min and max; reference values are dashed and named in the same
// margin; events (reboots, backup runs) are hairlines with a word, so "what happened here?"
// is answered on the chart.
function spread(items, top, bot, h) {   // nudge end labels apart; keep them inside [top, bot]
  items.sort((a, b) => a.y - b.y);
  if (items.length) items[0].y = Math.max(top, items[0].y);
  for (let i = 1; i < items.length; i++) if (items[i].y - items[i-1].y < h) items[i].y = items[i-1].y + h;
  for (let i = items.length - 1; i >= 0; i--) {
    const lim = i === items.length - 1 ? bot : items[i+1].y - h;
    if (items[i].y > lim) items[i].y = lim;
  }
  for (const it of items) it.y = Math.max(top, it.y);
  return items;
}
const lastOf = s => s.v[s.v.length - 1];
// niceTicks: 3–5 round values covering [lo, hi] — steps of 1, 2, 2.5 or 5 × 10^k
function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(st => st >= raw);
  const out = [];
  // the 1e-9 forgives float dust: 100 − 100 × 1 can come out as −1e-14, which must not add a −5 tick
  for (let v = Math.floor(lo / step + 1e-9) * step; v <= hi + step * 0.999; v += step) out.push(+v.toPrecision(12));
  return out;
}
function endText(t, s, n) { return (n === 1 ? "" : s.name + " ") + fmt(lastOf(s)) + (t.unit || ""); }
function sample(c, x, y, col, dash, band) {  // the line's own style, so a label needs no colour
  c.save();
  if (band) { c.fillStyle = band; c.fillRect(x, y - 4, 10, 8); c.strokeStyle = col; c.lineWidth = 1; c.strokeRect(x + .5, y - 3.5, 9, 7); }
  else { c.strokeStyle = col; c.lineWidth = 2; c.setLineDash(dash); c.beginPath(); c.moveTo(x, y); c.lineTo(x + 12, y); c.stroke(); }
  c.restore();
}
// Stacked bands in the mono themes carry sediment-style dot textures: grey tints alone sit ~12 %
// apart and blur together. Texture is set by band ORDER, not size, so a live chart's patterns
// stay put as the bands resize. The bottom band is a solid tint; each band above takes the next
// step of a four-step ladder that changes shape, mark size and spacing at once, so neighbours
// never look alike: coarse and fine alternate, and shape flips between square and round. The
// textured bands share one faint tint, so the marks carry the contrast. Tiles anchor to the
// canvas, so marks never crawl between ticks; each is drawn once and cached by colour, step and
// pixel ratio. Colour themes keep their plain fills: their hues already tell the bands apart.
const LADDER = [                // mark size and pitch in CSS px; hex rows are offset half a pitch
  {sq: true,  hex: false, m: 2.6, pitch: 3.6},   // dense square grid
  {sq: false, hex: true,  m: 3.4, pitch: 8},     // large, open circles
  {sq: true,  hex: true,  m: 1.6, pitch: 3.8},   // fine offset squares
  {sq: false, hex: true,  m: 1.4, pitch: 8},     // scattered dots
];
const texCache = new Map();
function texTile(c, ink, tint, step) {
  const dpr = devicePixelRatio || 1, k = [ink, tint, step, dpr].join("|");
  if (texCache.has(k)) return texCache.get(k);
  const {sq, hex, m, pitch} = LADDER[step % LADDER.length];
  const rowH = hex ? pitch * 0.866 : pitch, tw = pitch, th = hex ? rowH * 2 : rowH;
  const W = Math.max(1, Math.round(tw * dpr)), H = Math.max(1, Math.round(th * dpr));
  const cv = new OffscreenCanvas(W, H), x = cv.getContext("2d"), sx = W / tw, sy = H / th;
  x.scale(sx, sy); x.fillStyle = tint; x.fillRect(0, 0, tw, th); x.fillStyle = ink;
  const mark = (cx, cy) => { x.beginPath();
    if (sq) x.rect(cx - m / 2, cy - m / 2, m, m); else x.arc(cx, cy, m / 2, 0, 2 * Math.PI); x.fill(); };
  mark(pitch / 2, rowH / 2);
  if (hex) { mark(0, rowH * 1.5); mark(pitch, rowH * 1.5); }
  const p = c.createPattern(cv, "repeat"); p.setTransform(new DOMMatrix().scale(1 / sx, 1 / sy));
  texCache.set(k, p); return p;
}
function bandFill(c, col, i, T, ph, n) {
  if (!TH.mono) return alpha(col, .62);
  if (i === 0 || n < 2) return alpha(col, .38);                // the bottom band: solid
  return texTile(c, alpha(col, .75), alpha(col, .08), i - 1);  // tint kept under the dots: a 2 px band still reads
}

// one panel: range frame, refs, events, the data, and its end labels
function panel(c, t, raw, b, opts) {
  const S = t.stack ? stacked(raw) : raw, u = t.unit || "";
  let dlo = Infinity, dhi = -Infinity;
  for (const s of S) for (const v of s.v) { if (v < dlo) dlo = v; if (v > dhi) dhi = v; }
  if (!isFinite(dlo)) return null;
  // a range behind a line (its series' lo and hi): part of the data, so part of the scale
  const bandFor = i => t.stack ? null : (t.bands || []).find(b => b.of === (opts.split ? opts.colour : i));
  S.forEach((s, i) => { const b = bandFor(i); if (b) b.t.forEach((ts, k) => {
    if (ts < t.start || ts > t.end) return; dlo = Math.min(dlo, b.lo[k]); dhi = Math.max(dhi, b.hi[k]); }); });
  let lo = dlo, hi = dhi;
  if (!opts.split) for (const r of t.refs || []) { lo = Math.min(lo, r.value); hi = Math.max(hi, r.value); }
  const {L, T, pw, ph} = b;
  const X = ts => L + (ts - t.start) / (t.end - t.start) * pw;
  let Y, ticks;
  if (t.log) {
    // log scale: latency and the like span orders of magnitude; equal steps are equal ratios
    lo = Math.max(Math.min(lo, ...S.flatMap(s => s.v.filter(v => v > 0))), 1e-3);
    lo = Math.pow(10, Math.floor(Math.log10(lo))); hi = Math.pow(10, Math.ceil(Math.log10(Math.max(hi, lo * 10))));
    const l0 = Math.log10(lo), l1 = Math.log10(hi);
    Y = v => T + (1 - (Math.log10(Math.max(v, lo)) - l0) / (l1 - l0)) * ph;
    ticks = []; for (let e = l0; e <= l1 + 1e-9; e++) ticks.push(Math.pow(10, e));
  } else {
    if (t.ymin != null) lo = Math.min(lo, t.ymin);
    if (t.ymax != null) { hi = Math.max(hi, t.ymax); if (t.ymax === 100) hi = Math.min(hi, 100); }
    if (hi <= lo) { hi = lo + 1; if (lo !== 0) lo -= 1; }   // a flat zero reads 0–1, never −1–1
    // round the scale out to tick values, so the axis reads in whole steps
    ticks = niceTicks(lo, hi, opts.split ? 2 : ph > 140 ? 4 : 3);
    lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
    Y = v => T + (1 - (v - lo)/(hi - lo)) * ph;
  }
  // range frame: the axis line runs only where the data is; the numbers are whole steps
  const ax = L - 5;
  c.strokeStyle = TH.vars[5]; c.lineWidth = 1; c.setLineDash([]);
  c.beginPath(); c.moveTo(ax + .5, Math.round(Y(dhi))); c.lineTo(ax + .5, Math.round(Y(dlo)) + 1); c.stroke();
  c.textAlign = "right"; c.fillStyle = TH.vars[5];
  let lastY = Infinity;
  // a tick shows as many decimals as its step needs: 0, 10, 20 — not 0.00, 10.0, 20.0
  const st = ticks.length > 1 ? Math.abs(ticks[1] - ticks[0]) : 1;
  const tf = v => t.log || Math.abs(v) >= 1e4 ? fmt(v) : v.toLocaleString(LOC, {maximumFractionDigits: Math.max(0, -Math.floor(Math.log10(st) + 1e-9)) + (st / Math.pow(10, Math.floor(Math.log10(st))) === 2.5 ? 1 : 0)});
  ticks.forEach((v, i) => {
    const y = Y(v); if (lastY - y < 12) return;
    c.fillRect(ax - 3, Math.round(y), 3, 1);
    // the unit rides on the top number only: "2,000 ms", not a column of "ms"
    const top = i === ticks.length - 1 && u && c.measureText(tf(v) + " " + u).width < L - 10;
    c.fillText(top ? tf(v) + " " + u : tf(v), ax - 5, y); lastY = y;
  });
  const labels = [];
  // reference lines: "compared to what" — dashed, recessive, named at the right end
  if (!opts.split) {
    c.save(); c.setLineDash([4, 4]); c.lineWidth = 1; c.strokeStyle = TH.vars[5];
    for (const r of t.refs || []) {
      const y = Math.round(Y(r.value)) + .5;
      c.beginPath(); c.moveTo(L, y); c.lineTo(L + pw, y); c.stroke();
      labels.push({y, text: `${r.label} ${fmt(r.value)}${u}`, ref: true});
    }
    c.restore();
  }
  // events: a hairline and a word, at the top of the panel
  if (opts.events) {
    let lastX = -Infinity;
    c.save(); c.strokeStyle = TH.vars[5]; c.lineWidth = 1; c.setLineDash([1, 3]); c.fillStyle = TH.vars[5]; c.textAlign = "left";
    for (const e of t.events || []) {
      if (e.t < t.start || e.t > t.end) continue;
      const x = Math.round(X(e.t)) + .5;

// Block style, shared by every horizontal bar: a bar is a run of small cells with a gap

// whole and the free part is drawn as empty cells; otherwise rows share one scale and are

function drawBlocks(cv, t) {

  if (need > cv.parentElement.clientHeight) cv.style.height = need + "px";
  const [c, W, H] = setup(cv);
  if (!rows.length) { c.fillStyle = TH.vars[5]; c.fillText("no data", 10, 14); return null; }
  const lw = Math.min(W * 0.3, Math.max(...rows.map(r => c.measureText(r.label).width)) + 12);
  const tw = Math.min(W * 0.3, Math.max(...rows.map(r => c.measureText(r.text).width)) + 12);

    c.fillStyle = TH.vars[5]; c.textAlign = "center"; c.fillText(`${r.label} ${Math.round(r.value)} %`, x, 6);
  }

      }

function stamp() { $("stamp").textContent = "updated " + new Date(data.generated*1000).toLocaleTimeString(LOC, {hour12:false}); }

function tipAt(el, tip, e, cv, html) {
  const r = cv.getBoundingClientRect();

  tip.style.top = (e.clientY - el.getBoundingClientRect().top + 12) + "px";

// ── navigation ──────────────────────────────────────────────────────────────────

    if (i === cur) b.classList.add("on");
    if (g.live) { b.classList.add("live"); b.title = "Every chart here can show live"; }
    b.onclick = () => go(i); nav.append(b); });
  const rs = $("ranges"); rs.innerHTML = "";
  const g = META.groups[cur];

    if (!g.min || rix(r) < rix(g.min)) {

    } else if (r === range) b.className = "on";

  const first = ["newsprint", "carbon"];

// The help box: hotkeys, and the themes as buttons (a phone has no "t" key).

  if (e.key === "ArrowRight") go(cur + 1);
  if (e.key === "ArrowLeft") go(cur - 1);
  if (e.key === "ArrowDown" && !geometry().phone) { e.preventDefault(); turn(1); }
  if (e.key === "ArrowUp" && !geometry().phone) { e.preventDefault(); turn(-1); }
  if (e.key === "t") { const i = META.themes.findIndex(t => t.id === TH.id); applyTheme(META.themes[(i + 1) % META.themes.length].id); }
  if (e.key === "a") applyTheme("auto");
  if (e.key === "?") toggleHelp();
  if (e.key === "Escape") toggleHelp(false);
  const k = "1234567".indexOf(e.key); if (k >= 0 && META.ranges[k]) { pick = META.ranges[k]; load(); }
});
let tx = null, ty = null;
// a sideways drag inside a wide table scrolls the table; it must not also change the group
addEventListener("touchstart", e => { if (e.target.closest && e.target.closest("pre")) { tx = null; return; }
  tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > 2*Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1));
  tx = null;
}, {passive:true});
// A phone fires resize whenever its address bar slides in or out; only a change of width
// (a rotation, a desktop window dragged) can change a phone's layout.
let rz, lastW = innerWidth;
addEventListener("resize", () => {
  if (geometry().phone && innerWidth === lastW) return;
  lastW = innerWidth; clearTimeout(rz); rz = setTimeout(render, 150);
});

(async () => {
  META = await (await fetch("api/meta")).json();
  $("brand").textContent = META.title; document.title = META.title;
  pick = META.default_range;
  const [h, rg] = location.hash.slice(1).split("/");
  const i = META.groups.findIndex(g => g.id === h); if (i >= 0) cur = i;
  if (META.ranges.includes(rg)) pick = rg;
  const q = new URLSearchParams(location.search).get("theme");
  applyTheme(q || localStorage.getItem("askee-theme") || META.default_theme);
  load();
})();
</script>
